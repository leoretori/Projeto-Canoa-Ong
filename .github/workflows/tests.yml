name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r backend/requirements.txt
          pip install pytest moto

      - name: Rodar suíte de testes
        run: pytest tests/ -v

  sam-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cfn-lint
        run: pip install cfn-lint

      - name: Validar CloudFormation com cfn-lint
        run: cfn-lint template.yaml

      - name: Validar template.yaml com SAM CLI
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: sam validate --lint --region us-east-1

